events {}
http {
  server {
    listen 8080;
    absolute_redirect off;
    location /services/llm/ui/ { proxy_pass http://ui:3000/ui/; }
    location /services/llm/_next/ { proxy_pass http://ui:3000/_next/; }
    location = /services/llm/favicon.ico { proxy_pass http://ui:3000/favicon.ico; }
    location /services/llm/models { proxy_pass http://gateway:4000; }
        location /services/llm/v1/models { proxy_pass http://gateway:4000; }
        location /services/llm/health/ { proxy_pass http://gateway:4000; }
    location /services/llm/ { proxy_pass http://backend:4001; }
    location / { return 404; }
  }
}
