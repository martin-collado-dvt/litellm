name: Build contribution UI for cluster test
on:
  push:
    branches: [litellm_ui_cluster_build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Build exact contribution revision on native amd64
        run: docker build -f ui/Dockerfile -t litellm-ui:pr45316 .
      - name: Export image
        run: docker save litellm-ui:pr45316 | gzip -1 > "$RUNNER_TEMP/litellm-ui.tar.gz"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: litellm-ui-pr45316
          path: ${{ runner.temp }}/litellm-ui.tar.gz
          retention-days: 3
          compression-level: 0
